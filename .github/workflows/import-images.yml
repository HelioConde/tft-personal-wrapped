name: Import TFT Wrapped Images

on:
  push:
    branches: [main]
    paths:
      - 'tft-wrapped-20-imagens-otimizadas.zip'

permissions:
  contents: write

concurrency:
  group: tft-wrapped-assets-import
  cancel-in-progress: false

jobs:
  import-visual-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack original image package
        run: python3 scripts/import_visual_pack.py
      - name: Commit verified assets and remove transfer archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tft-wrapped tft-wrapped-20-imagens-otimizadas.zip
          git diff --cached --quiet && exit 0
          git commit -m 'assets: publish 20 optimized TFT Wrapped illustrations and icons'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Cannot push imported assets after 3 attempts.' >&2
          exit 1
