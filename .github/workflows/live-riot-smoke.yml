name: Live Riot Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: read

jobs:
  live-riot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke production with real Riot data
        env:
          LIVE_RIOT_SMOKE: "1"
          PLAYWRIGHT_BASE_URL: https://helioconde.github.io/tft-personal-wrapped/
        run: npx playwright test tests/live-riot.spec.js
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tft-wrapped-live-riot-smoke
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
