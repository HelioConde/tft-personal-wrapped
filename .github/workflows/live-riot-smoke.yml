name: Live Riot Smoke

on:
  push:
    branches: [main]
    paths:
      - "scripts/live-backend-smoke.mjs"
      - ".github/workflows/live-riot-smoke.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: read

jobs:
  backend-contract:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query real Riot TFT backend (not GitHub Pages)
        run: node scripts/live-backend-smoke.mjs

  published-site:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check published Pages UX with real Riot data
        env:
          LIVE_RIOT_SMOKE: "1"
          PLAYWRIGHT_BASE_URL: https://helioconde.github.io/tft-personal-wrapped/
        run: npx playwright test tests/live-riot.spec.js
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tft-wrapped-published-smoke
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
