name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets-config.js'
      - 'assets-enabled.js'
      - 'artwork.css'
      - 'backend-config.js'
      - 'live-update.js'
      - 'privacidade.html'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site and stamp deployed revision
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site
          cp index.html styles.css artwork.css app.js assets-config.js assets-enabled.js backend-config.js live-update.js privacidade.html _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -f assets/tft-wrapped/icons/crown.webp ] && [ -f assets/tft-wrapped/illustrations/hero-cosmic-arena.webp ]; then
            printf 'window.TFT_WRAPPED_ASSETS_ENABLED = true;\n' > _site/assets-enabled.js
          else
            printf 'window.TFT_WRAPPED_ASSETS_ENABLED = false;\n' > _site/assets-enabled.js
          fi
          printf '{"sha":"%s","publishedAt":"%s"}\n' "$DEPLOY_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
          test -s _site/index.html
          test -s _site/version.json
      # Pages must first be enabled from repository Settings → Pages.
      # It is already enabled. Do not request elevated admin access to create it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
